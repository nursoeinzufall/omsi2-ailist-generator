name: Windows-Programm bauen

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pakete installieren
        run: npm install

      - name: Programm-Ordner bauen
        run: npm run pack

      - name: Programm-Ordner hochladen
        uses: actions/upload-artifact@v4
        with:
          name: OMSI2-Listen-Generator-Ordner
          path: dist/OMSI2-Listen-Generator-win32-x64

      - name: Einzelne .exe bauen (optional)
        run: npm run dist
        continue-on-error: true

      - name: Einzelne .exe hochladen
        uses: actions/upload-artifact@v4
        with:
          name: OMSI2-Listen-Generator-EinzelExe
          path: dist/OMSI2-Listen-Generator.exe
          if-no-files-found: ignore

      - name: Release erstellen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path "dist/OMSI2-Listen-Generator-win32-x64" -DestinationPath "dist/OMSI2-Listen-Generator-Ordner.zip"
          $files = @("dist/OMSI2-Listen-Generator-Ordner.zip")
          if (Test-Path "dist/OMSI2-Listen-Generator.exe") { $files += "dist/OMSI2-Listen-Generator.exe" }
          gh release create "v1.0.${{ github.run_number }}" $files --target "${{ github.sha }}" --title "Version 1.0.${{ github.run_number }}" --notes "Automatisch gebaut. Download: Programm-Ordner (Zip) oder Einzel-EXE."
