<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OMSI 2 Listen-Generator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="top">
    <h1 data-t="title"></h1>
    <div class="tr"><button id="infoBtn" data-t="info"></button><button id="settingsBtn" data-t="settings"></button><label class="chk"><span data-t="lang"></span><select id="lang"></select></label></div>
  </div>
  <div class="modes" role="group">
    <button data-mode="cars" data-t="mode_cars"></button>
    <button data-mode="park" data-t="mode_park"></button>
    <button data-mode="hum" data-t="mode_hum"></button>
  </div>
  <p id="sub"></p>
</header>

<div class="bar">
  <button class="main" id="pick" data-t="rescan"></button><span id="rootInfo"></span>
  <button id="load" data-t="load"></button>
  <input type="text" id="q" size="18">
  <select id="folder"></select>
  <label class="chk" id="likelyBox"><input type="checkbox" id="onlyAi" checked> <span data-t="likely"></span></label>
  <span class="sp"></span>
  <button id="allVis" data-t="selVis"></button>
  <button id="noneVis" data-t="deselVis"></button>
  <button id="allOn" data-t="allOn"></button>
  <button id="allOff" data-t="allOff"></button>
  <button id="autoGrp" data-t="autoGrp"></button>
  <button id="newGrp" data-t="newGrp"></button>
  <button class="main" id="export" disabled data-t="export"></button>
</div>
<div class="bar2">
  <button id="saveSel" data-t="saveSel"></button>
  <button id="loadSel" data-t="loadSel"></button>
  <button id="merge" data-t="merge" disabled></button>
  <button id="chk" data-t="chkBtn"></button>
  <select id="mixSel"></select>
  <button id="real" data-t="real"></button>
  <span id="fmBox"><label class="chk"><span data-t="fmLbl"></span><select id="fmSel"><option value="num" data-t="fmNum"></option><option value="pct" data-t="fmPct"></option></select></label></span>
</div>
<div id="status"></div>
<div id="scanRow"><progress id="prog" hidden></progress><span id="scanInfo"></span></div>
<section id="stats" hidden></section>
<section id="check" hidden></section>
<main><div id="out" class="empty"></div></main>
<aside id="prev" hidden><button id="prevX">✕</button><img id="prevImg" alt="" hidden><p class="cap" id="prevMsg"></p><p class="cap" id="prevCap"></p></aside>

<dialog id="setDlg">
<div class="dhead"><b data-t="setTitle"></b><button id="setX">✕</button></div>
<h3 data-t="setFolders"></h3>
<div class="frow"><span data-t="fOmsi"></span><code id="pOmsi"></code><button id="bOmsi" data-t="choose"></button><button id="cOmsi" data-t="clear"></button></div>
<div class="frow"><span data-t="fOpen"></span><code id="pOpen"></code><button id="bOpen" data-t="choose"></button><button id="cOpen" data-t="clear"></button></div>
<div class="frow"><span></span><small data-t="setHint"></small></div>
<h3 data-t="setLook"></h3>
<div class="frow"><span data-t="theme"></span><select id="themeSel"><option value="system" data-t="thSystem"></option><option value="light" data-t="thLight"></option><option value="dark" data-t="thDark"></option><option value="custom" data-t="thCustom"></option></select></div>
<div id="colBox" hidden>
  <div class="frow"><span data-t="colPreset"></span><select id="colPreset"></select><button id="colReset" data-t="colReset"></button></div>
  <div id="colGrid"></div>
  <div class="frow"><span></span><small id="colWarn"></small></div>
</div>
<div class="frow"><span data-t="zoom"></span><input type="range" id="zoomR" min="80" max="160" step="5"><output id="zoomO"></output></div>
<div class="frow"><span></span><label class="chk"><input type="checkbox" id="chartChk"> <span data-t="showChart"></span></label></div>
<div class="frow"><span data-t="freqMode"></span><select id="fmSet"><option value="num" data-t="fmNum"></option><option value="pct" data-t="fmPct"></option></select></div>
<h3 data-t="setMix"></h3>
<div class="frow"><select id="mixEdSel"></select><button id="mixNew" data-t="mixNew"></button></div>
<div id="mixEd" hidden>
  <div class="frow"><span data-t="mixName"></span><input type="text" id="mixName" size="22"></div>
  <div id="mixSl"></div>
  <div class="frow"><span></span><output id="mixSumO" style="text-align:left"></output></div>
  <div class="frow"><button class="main" id="mixSave" data-t="mixSave"></button><button id="mixDel" data-t="mixDel"></button></div>
</div>
<h3 data-t="setData"></h3>
<div class="frow"><button id="expSet" data-t="expSet"></button><button id="impSet" data-t="impSet"></button><button id="clrCache" data-t="clrCache"></button></div>
</dialog>
<dialog id="infoDlg">
<div class="dhead"><b data-t="infoTitle"></b><button id="infoX">✕</button></div>
<p><b data-t="title"></b> · <span id="infoVer"></span></p>
<h3 data-t="infoGuideH"></h3><ul id="infoGuide"></ul>
<h3 data-t="infoLogH"></h3><ul id="infoLog"></ul>
<p style="margin-top:16px;color:var(--mute)" data-t="infoBy"></p>
</dialog>
<div id="ribbon"><span>made by Claude and NurSoEinZufall</span></div>
<dialog id="grpDlg"><form method="dialog"><label><span id="grpLbl"></span><br><input type="text" id="grpIn" autocomplete="off"></label>
<p><button class="main" value="ok">OK</button> <button value="x" formnovalidate>✕</button></p></form></dialog>
<script src="app.js"></script>
</body>
</html>
